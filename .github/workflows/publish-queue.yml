name: Publish scheduled ALL-POST items

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

jobs:
  publish-due-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process due posts
        run: |
          OIDC_TOKEN="$(curl --fail-with-body --silent --show-error --get "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --data-urlencode "audience=https://all-post.vercel.app" \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${OIDC_TOKEN}"
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Accept: application/json" \
            https://all-post.vercel.app/api/cron/publish-queue
